<g transform="translate(380 268) rotate(6) scale(1.8)"><g class="f f1" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15.194 13.707 3.814 1.86-1.86 3.814"/><path d="M16.47214 7.52786 A 5 10 0 1 0 13 21.79796"/><path d="M21.79796 11 A 10 5 0 1 0 19 15.57071"/></g></g>
<g transform="translate(640 70) rotate(-4) scale(1.5)"><g class="f f2" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></g></g>
<g class="k">
<rect x="882" y="92" width="216" height="216" rx="54" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
<g transform="translate(898 102) scale(2.85)"><g class="bbbob"><ellipse cx="32" cy="57" rx="17" ry="3.2" fill="#000" opacity=".35" class="bbshadow"/><path d="M10 21 L32 32 V54 L10 43 Z" fill="url(#bbl)"/><path d="M54 21 L32 32 V54 L54 43 Z" fill="#0b4e24"/><path d="M32 10 L54 21 L32 32 L10 21 Z" fill="url(#bbt)"/><path d="M10 21 L32 32 L54 21" fill="none" stroke="#addfc0" stroke-opacity=".55" stroke-width=".8" stroke-linejoin="round"/><path d="M32 32 V54" stroke="#000" stroke-opacity=".18" stroke-width=".8"/><g clip-path="url(#bbc)"><rect class="bbshine" x="-14" y="6" width="14" height="30" fill="url(#bbsh)" transform="skewX(-25)"/></g><g transform="translate(.5 .8)"><g transform="matrix(0.8250 0.4125 -0.8250 0.4125 32 11.100)" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g></g><g class="bbglow" transform="matrix(0.8250 0.4125 -0.8250 0.4125 32 11.100)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g></g></g>
</g>
